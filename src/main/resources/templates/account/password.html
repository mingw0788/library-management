<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>修改密码 · 图书管理系统</title>
    <link rel="stylesheet" href="/css/library.css" th:href="@{/css/library.css}">
</head>
<body>
<main class="page-shell">
    <section class="hero" aria-labelledby="password-title">
        <p class="eyebrow">账号安全</p>
        <h1 class="hero-title" id="password-title">修改密码</h1>
        <p class="hero-description">密码须为 12—64 个字符，且 UTF-8 编码不超过 72 字节。修改后需要重新登录。</p>
    </section>
    <section class="info-card" aria-label="修改密码表单">
        <p class="card-copy" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <form method="post" th:action="@{/account/password}">
            <p>
                <label for="currentPassword">当前密码</label><br>
                <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
            </p>
            <p>
                <label for="newPassword">新密码</label><br>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="64">
            </p>
            <p>
                <label for="confirmPassword">再次输入新密码</label><br>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="64">
            </p>
            <button type="submit">保存并重新登录</button>
        </form>
        <form method="post" th:action="@{/logout}">
            <button type="submit">退出登录</button>
        </form>
    </section>
</main>
</body>
</html>
