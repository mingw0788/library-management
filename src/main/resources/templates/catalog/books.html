<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书目管理 · 图书管理系统</title>
    <link rel="stylesheet" href="/css/library.css" th:href="@{/css/library.css}">
</head>
<body><main class="page-shell">
    <section class="hero">
        <p class="eyebrow">管理员与馆员</p><h1 class="hero-title">书目资料</h1>
        <p class="hero-description">当前账号：<span th:text="${loginName}"></span>。ISBN 会去除空格和连字符并验证校验位；留空表示没有 ISBN。归档会保留书目历史。</p>
        <p class="message-success" th:if="${notice}" th:text="${notice}" role="status"></p>
        <p class="message-error" th:if="${error}" th:text="${error}" role="alert"></p>
        <form method="get" th:action="@{/staff/books}">
            <label for="book-query">按书名、作者或 ISBN 查找</label><br>
            <input id="book-query" name="q" maxlength="100" th:value="${query}">
            <button type="submit">查询</button><a th:href="@{/staff/books}">显示全部</a>
        </form>
        <form method="post" th:action="@{/staff/books}">
            <h2 class="card-title">新增书目</h2>
            <p><label for="new-book-title">书名</label><br><input id="new-book-title" name="title" required maxlength="200" th:value="${formKey == 'BOOK_CREATE' and formValues != null ? formValues['title'] : ''}" th:attr="aria-invalid=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('title')},aria-describedby=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('title') ? 'BOOK_CREATE-title-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError('BOOK_CREATE', 'title')}"></span></p>
            <p><label for="new-book-author">作者</label><br><input id="new-book-author" name="author" required maxlength="200" th:value="${formKey == 'BOOK_CREATE' and formValues != null ? formValues['author'] : ''}" th:attr="aria-invalid=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('author')},aria-describedby=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('author') ? 'BOOK_CREATE-author-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError('BOOK_CREATE', 'author')}"></span></p>
            <p><label for="new-book-publisher">出版社（可选）</label><br><input id="new-book-publisher" name="publisher" maxlength="200" th:value="${formKey == 'BOOK_CREATE' and formValues != null ? formValues['publisher'] : ''}" th:attr="aria-invalid=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('publisher')},aria-describedby=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('publisher') ? 'BOOK_CREATE-publisher-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError('BOOK_CREATE', 'publisher')}"></span></p>
            <p><label for="new-book-date">出版日期（可选）</label><br><input id="new-book-date" name="publishedDate" type="date" th:value="${formKey == 'BOOK_CREATE' and formValues != null ? formValues['publishedDate'] : ''}" th:attr="aria-invalid=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('publishedDate')},aria-describedby=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('publishedDate') ? 'BOOK_CREATE-publishedDate-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError('BOOK_CREATE', 'publishedDate')}"></span></p>
            <p><label for="new-book-isbn">ISBN（可选）</label><br><input id="new-book-isbn" name="isbn" maxlength="25" autocomplete="off" th:value="${formKey == 'BOOK_CREATE' and formValues != null ? formValues['isbn'] : ''}" th:attr="aria-invalid=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('isbn')},aria-describedby=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('isbn') ? 'BOOK_CREATE-isbn-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError('BOOK_CREATE', 'isbn')}"></span></p>
            <p><label for="new-book-category">分类</label><br><select id="new-book-category" name="categoryId" required th:attr="aria-invalid=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('categoryId')},aria-describedby=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('categoryId') ? 'BOOK_CREATE-categoryId-error' : null}">
                <option value="">请选择分类</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${formKey == 'BOOK_CREATE' and formValues != null and formValues['categoryId'] == category.id.toString()}"></option>
            </select><span th:replace="~{fragments/form-feedback :: fieldError('BOOK_CREATE', 'categoryId')}"></span></p>
            <p><label for="new-book-description">简介（可选，最多 2000 字）</label><br><textarea id="new-book-description" name="description" maxlength="2000" rows="5" th:text="${formKey == 'BOOK_CREATE' and formValues != null ? formValues['description'] : ''}" th:attr="aria-invalid=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('description')},aria-describedby=${formKey == 'BOOK_CREATE' and fieldErrors != null and fieldErrors.containsKey('description') ? 'BOOK_CREATE-description-error' : null}"></textarea><span th:replace="~{fragments/form-feedback :: fieldError('BOOK_CREATE', 'description')}"></span></p>
            <button type="submit" th:disabled="${#lists.isEmpty(categories)}">新增书目</button>
            <span th:if="${#lists.isEmpty(categories)}">请先创建分类。</span>
        </form>
    </section>
    <section class="info-card">
        <h2 class="card-title">书目列表</h2>
        <p><a th:href="@{/staff/copies}">管理实体副本</a></p>
        <p th:if="${#lists.isEmpty(books)}">没有匹配的书目。</p>
        <article th:each="book : ${books}" class="reader-row">
            <p>书目编号 <span th:text="${book.id}"></span> · <strong th:text="${book.title}"></strong> · <span th:text="${book.status}"></span></p>
            <div th:with="inventory=${copyInventory[book.id]}"><p>副本数量：可借 <span th:text="${inventory.available}"></span> · 借出 <span th:text="${inventory.onLoan}"></span> · 已注销 <span th:text="${inventory.withdrawn}"></span> · 合计 <span th:text="${inventory.total()}"></span></p></div>
            <p th:if="${book.status.name() == 'ACTIVE'}">编辑书目资料时请使用当前版本；如果他人先提交了修改，旧版本会被拒绝。</p>
            <form method="post" th:if="${book.status.name() == 'ACTIVE'}" th:action="@{/staff/books/{id}/update(id=${book.id})}">
                <input type="hidden" name="version" th:value="${book.version}">
                <p><label th:for="${'book-title-' + book.id}">书名</label><br><input th:id="${'book-title-' + book.id}" name="title" required maxlength="200" th:value="${formKey == 'BOOK_UPDATE_' + book.id and formValues != null ? formValues['title'] : book.title}" th:attr="aria-invalid=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('title')},aria-describedby=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('title') ? 'BOOK_UPDATE_' + book.id + '-title-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError(${ 'BOOK_UPDATE_' + book.id }, 'title')}"></span></p>
                <p><label th:for="${'book-author-' + book.id}">作者</label><br><input th:id="${'book-author-' + book.id}" name="author" required maxlength="200" th:value="${formKey == 'BOOK_UPDATE_' + book.id and formValues != null ? formValues['author'] : book.author}" th:attr="aria-invalid=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('author')},aria-describedby=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('author') ? 'BOOK_UPDATE_' + book.id + '-author-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError(${ 'BOOK_UPDATE_' + book.id }, 'author')}"></span></p>
                <p><label th:for="${'book-publisher-' + book.id}">出版社</label><br><input th:id="${'book-publisher-' + book.id}" name="publisher" maxlength="200" th:value="${formKey == 'BOOK_UPDATE_' + book.id and formValues != null ? formValues['publisher'] : book.publisher}" th:attr="aria-invalid=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('publisher')},aria-describedby=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('publisher') ? 'BOOK_UPDATE_' + book.id + '-publisher-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError(${ 'BOOK_UPDATE_' + book.id }, 'publisher')}"></span></p>
                <p><label th:for="${'book-date-' + book.id}">出版日期</label><br><input th:id="${'book-date-' + book.id}" name="publishedDate" type="date" th:value="${formKey == 'BOOK_UPDATE_' + book.id and formValues != null ? formValues['publishedDate'] : book.publishedDate}" th:attr="aria-invalid=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('publishedDate')},aria-describedby=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('publishedDate') ? 'BOOK_UPDATE_' + book.id + '-publishedDate-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError(${ 'BOOK_UPDATE_' + book.id }, 'publishedDate')}"></span></p>
                <p><label th:for="${'book-isbn-' + book.id}">ISBN</label><br><input th:id="${'book-isbn-' + book.id}" name="isbn" maxlength="25" th:value="${formKey == 'BOOK_UPDATE_' + book.id and formValues != null ? formValues['isbn'] : book.isbn}" th:attr="aria-invalid=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('isbn')},aria-describedby=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('isbn') ? 'BOOK_UPDATE_' + book.id + '-isbn-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError(${ 'BOOK_UPDATE_' + book.id }, 'isbn')}"></span></p>
                <p><label>分类</label><br><select name="categoryId" required th:attr="aria-invalid=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('categoryId')},aria-describedby=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('categoryId') ? 'BOOK_UPDATE_' + book.id + '-categoryId-error' : null}">
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${formKey == 'BOOK_UPDATE_' + book.id and formValues != null ? formValues['categoryId'] == category.id.toString() : category.id == book.categoryId}"></option>
                </select><span th:replace="~{fragments/form-feedback :: fieldError(${ 'BOOK_UPDATE_' + book.id }, 'categoryId')}"></span></p>
                <p><label th:for="${'book-description-' + book.id}">简介</label><br><textarea th:id="${'book-description-' + book.id}" name="description" maxlength="2000" rows="5" th:text="${formKey == 'BOOK_UPDATE_' + book.id and formValues != null ? formValues['description'] : book.description}" th:attr="aria-invalid=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('description')},aria-describedby=${formKey == 'BOOK_UPDATE_' + book.id and fieldErrors != null and fieldErrors.containsKey('description') ? 'BOOK_UPDATE_' + book.id + '-description-error' : null}"></textarea><span th:replace="~{fragments/form-feedback :: fieldError(${ 'BOOK_UPDATE_' + book.id }, 'description')}"></span></p>
                <button type="submit">保存修改</button>
            </form>
            <p><span>作者：</span><span th:text="${book.author}"></span> · <span>出版社：</span><span th:text="${book.publisher}"></span></p>
            <p><span>出版日期：</span><span th:text="${book.publishedDate}"></span> · ISBN <span th:text="${book.isbn}"></span></p>
            <p><span>简介：</span><span th:text="${book.description}"></span></p>
            <form method="post" th:if="${book.status.name() == 'ACTIVE'}" th:action="@{/staff/books/{id}/archive(id=${book.id})}">
                <button type="submit">归档书目</button>
            </form>
            <p th:if="${book.status.name() == 'ARCHIVED'}">该书目已归档，资料保留供工作人员查阅。</p>
        </article>
        <p><a th:href="@{/staff}">返回工作人员工作区</a></p>
    </section>
</main></body></html>
