<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>修改密码 · 图书管理系统</title>
    <link rel="stylesheet" href="/css/library.css" th:href="@{/css/library.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: navigation}"></header>
<main id="main-content" tabindex="-1" class="page-shell">
    <section class="hero" aria-labelledby="password-title">
        <p class="eyebrow">账号安全</p>
        <h1 class="hero-title" id="password-title">修改密码</h1>
        <p class="hero-description">密码须为 12—64 个字符，且 UTF-8 编码不超过 72 字节。修改后需要重新登录。</p>
    </section>
    <section class="info-card" aria-label="修改密码表单">
        <p class="message-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <form method="post" th:action="@{/account/password}">
            <p>
                <label for="currentPassword">当前密码</label><br>
                <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required th:attr="aria-invalid=${formKey == 'PASSWORD_CHANGE' and fieldErrors != null and fieldErrors.containsKey('currentPassword')},aria-describedby=${formKey == 'PASSWORD_CHANGE' and fieldErrors != null and fieldErrors.containsKey('currentPassword') ? 'PASSWORD_CHANGE-currentPassword-error' : null}">
                <span th:replace="~{fragments/form-feedback :: fieldError('PASSWORD_CHANGE', 'currentPassword')}"></span>
            </p>
            <p>
                <label for="newPassword">新密码</label><br>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="64" th:attr="aria-invalid=${formKey == 'PASSWORD_CHANGE' and fieldErrors != null and (fieldErrors.containsKey('newPassword') or fieldErrors.containsKey('confirmPassword'))},aria-describedby=${formKey == 'PASSWORD_CHANGE' and fieldErrors != null and fieldErrors.containsKey('newPassword') ? 'PASSWORD_CHANGE-newPassword-error' : null}">
                <span th:replace="~{fragments/form-feedback :: fieldError('PASSWORD_CHANGE', 'newPassword')}"></span>
            </p>
            <p>
                <label for="confirmPassword">再次输入新密码</label><br>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="64" th:attr="aria-invalid=${formKey == 'PASSWORD_CHANGE' and fieldErrors != null and fieldErrors.containsKey('confirmPassword')},aria-describedby=${formKey == 'PASSWORD_CHANGE' and fieldErrors != null and fieldErrors.containsKey('confirmPassword') ? 'PASSWORD_CHANGE-confirmPassword-error' : null}">
                <span th:replace="~{fragments/form-feedback :: fieldError('PASSWORD_CHANGE', 'confirmPassword')}"></span>
            </p>
            <button type="submit">保存并重新登录</button>
        </form>
        <p><a th:href="@{/account/profile}">返回个人资料</a></p>
    </section>
</main>
</body>
</html>
