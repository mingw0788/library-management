<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>借阅记录 · 图书管理系统</title>
    <link rel="stylesheet" href="/css/library.css" th:href="@{/css/library.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: navigation}"></header>
<main id="main-content" tabindex="-1" class="page-shell">
    <section class="hero">
        <p class="eyebrow">管理员与馆员</p>
        <h1 class="hero-title">全馆借阅记录</h1>
        <p class="hero-description">当前账号：<span th:text="${loginName}"></span>。可按读者、条码、借出日期和借阅状态筛选。</p>
        <p class="message-error" th:if="${error}" th:text="${error}" role="alert"></p>
        <form class="loan-filters" method="get" th:action="@{/staff/loans}">
            <p><label for="reader">读者证号或姓名</label><br><input id="reader" name="reader" maxlength="100" th:value="${reader}"></p>
            <p><label for="barcode">馆藏条码</label><br><input id="barcode" name="barcode" maxlength="50" th:value="${barcode}"></p>
            <p><label for="state">借阅状态</label><br>
                <select id="state" name="state">
                    <option value="CURRENT" th:selected="${state == 'CURRENT'}">当前未还</option>
                    <option value="RETURNED" th:selected="${state == 'RETURNED'}">已归还</option>
                    <option value="ALL" th:selected="${state == 'ALL'}">全部记录</option>
                </select></p>
            <p><label for="from-date">借出日期从</label><br><input id="from-date" type="date" name="fromDate" th:value="${fromDate}"></p>
            <p><label for="to-date">到</label><br><input id="to-date" type="date" name="toDate" th:value="${toDate}"></p>
            <div class="filter-actions"><button type="submit">筛选</button><a th:href="@{/staff/loans}">重置筛选</a></div>
        </form>
        <p class="record-count" th:unless="${error}">找到 <strong th:text="${loanPage.totalElements}"></strong> 条记录 · 每页 10 条</p>
        <div class="record-empty" th:if="${loanPage.empty and error == null}"><h2>没有符合条件的借阅记录</h2><p>默认显示当前未还；查看历史请选择“已归还”或“全部记录”，也可重置日期条件。</p><a th:href="@{/staff/loans(state='ALL')}">查看全部借阅记录</a></div>
        <div th:unless="${loanPage.empty}" class="table-scroll record-table" tabindex="0" aria-label="记录列表">
            <table>
                <thead><tr><th>读者</th><th>图书</th><th>借出时间</th><th>应还日期</th><th>归还时间</th><th>状态</th><th>经办人</th></tr></thead>
                <tbody>
                <tr th:each="loan : ${loanPage.content}">
                    <td data-label="读者"><span th:text="${loan.readerName}"></span><br><small th:text="${loan.readerNo}"></small></td>
                    <td data-label="图书"><span th:text="${loan.bookTitle}"></span><br><small th:text="${loan.barcode}"></small></td>
                    <td data-label="借出时间" th:text="${loan.borrowedAt}"></td><td data-label="应还日期" th:text="${loan.dueDate}"></td>
                    <td data-label="归还时间" th:text="${loan.returnedAt == null ? '未归还' : loan.returnedAt}"></td>
                    <td data-label="状态"><span th:replace="~{fragments/loan-status :: status(${loan})}"></span></td>
                    <td data-label="经办人"><span th:text="${loan.checkoutOperatorName}"></span><br><small th:if="${loan.returnOperatorName != null}" th:text="${loan.returnOperatorName}"></small></td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:if="${loanPage.totalPages > 1}" class="page-nav" aria-label="全馆借阅分页">
            <span>共 <span th:text="${loanPage.totalElements}"></span> 条</span>
            <a th:if="${loanPage.hasPrevious()}" th:href="@{/staff/loans(page=${loanPage.number - 1},reader=${reader},barcode=${barcode},state=${state},fromDate=${fromDate},toDate=${toDate})}">上一页</a>
            <strong aria-current="page">第 <span th:text="${loanPage.number + 1}"></span> / <span th:text="${loanPage.totalPages}"></span> 页</strong>
            <a th:if="${loanPage.hasNext()}" th:href="@{/staff/loans(page=${loanPage.number + 1},reader=${reader},barcode=${barcode},state=${state},fromDate=${fromDate},toDate=${toDate})}">下一页</a>
        </nav>
        <p><a th:href="@{/staff/loans/checkout}">办理借出</a>　<a th:href="@{/staff/loans/return}">办理归还</a>　<a th:href="@{/staff}">返回工作人员工作区</a></p>
    </section>
</main></body></html>
