spring:
  application:
    name: library-management
  profiles:
    default: dev
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: "SET time_zone = '+00:00'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true

library:
  bootstrap:
    admin:
      enabled: ${LIBRARY_INITIAL_ADMIN_ENABLED:false}
      username: ${LIBRARY_INITIAL_ADMIN_USERNAME:}
      password: ${LIBRARY_INITIAL_ADMIN_PASSWORD:}
      display-name: ${LIBRARY_INITIAL_ADMIN_DISPLAY_NAME:}

server:
  port: 8080
  address: 127.0.0.1
