<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>办理借出 · 图书管理系统</title>
    <link rel="stylesheet" href="/css/library.css" th:href="@{/css/library.css}">
</head>
<body><main class="page-shell">
    <section class="hero">
        <p class="eyebrow">管理员与馆员</p>
        <h1 class="hero-title">办理借出</h1>
        <p class="hero-description">当前账号：<span th:text="${loginName}"></span>。请核对读者证号和实体副本条码。系统会在提交时重新检查读者资格和副本状态。</p>
        <p th:if="${notice}" th:text="${notice}" role="status"></p>
        <p th:if="${error}" th:text="${error}" role="alert"></p>
        <form method="post" th:action="@{/staff/loans/checkout}">
            <p><label for="reader-no">读者证号</label><br>
                <input id="reader-no" name="readerNo" required maxlength="50" autocomplete="off"></p>
            <p><label for="copy-barcode">馆藏条码</label><br>
                <input id="copy-barcode" name="barcode" required maxlength="50" autocomplete="off"></p>
            <button type="submit">确认借出</button>
        </form>
        <p>默认借期 14 天；读者最多同时借阅 5 册。有未还逾期记录或同一书目未归还时不能再次借阅。</p>
        <p><a th:href="@{/staff/loans/return}">办理归还</a>　<a th:href="@{/staff/copies}">查看实体副本</a>　<a th:href="@{/staff}">返回工作人员工作区</a></p>
    </section>
</main></body></html>
