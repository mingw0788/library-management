<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作人员账号管理 · 图书管理系统</title>
    <link rel="stylesheet" href="/css/library.css" th:href="@{/css/library.css}">
</head>
<body><main class="page-shell">
    <section class="hero">
        <p class="eyebrow">仅管理员可用</p><h1 class="hero-title">工作人员账号</h1>
        <p class="hero-description">当前账号：<span th:text="${loginName}"></span>。创建或重置后请通过安全方式把临时密码交给本人。</p>
        <p class="message-success" th:if="${notice}" th:text="${notice}" role="status"></p>
        <p class="message-error" th:if="${error}" th:text="${error}" role="alert"></p>
        <form method="post" th:action="@{/admin/accounts}">
            <p><label for="staff-login-name">登录名</label><br><input id="staff-login-name" name="loginName" required minlength="3" maxlength="50" autocomplete="off" th:value="${formKey == 'STAFF_CREATE' and formValues != null ? formValues['loginName'] : ''}" th:attr="aria-invalid=${formKey == 'STAFF_CREATE' and fieldErrors != null and fieldErrors.containsKey('loginName')},aria-describedby=${formKey == 'STAFF_CREATE' and fieldErrors != null and fieldErrors.containsKey('loginName') ? 'STAFF_CREATE-loginName-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError('STAFF_CREATE', 'loginName')}"></span></p>
            <p><label for="staff-initial-password">初始密码</label><br><input id="staff-initial-password" name="initialPassword" type="password" required minlength="12" maxlength="64" autocomplete="new-password" th:attr="aria-invalid=${formKey == 'STAFF_CREATE' and fieldErrors != null and fieldErrors.containsKey('initialPassword')},aria-describedby=${formKey == 'STAFF_CREATE' and fieldErrors != null and fieldErrors.containsKey('initialPassword') ? 'STAFF_CREATE-initialPassword-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError('STAFF_CREATE', 'initialPassword')}"></span></p>
            <p><label for="staff-display-name">姓名</label><br><input id="staff-display-name" name="displayName" required maxlength="100" th:value="${formKey == 'STAFF_CREATE' and formValues != null ? formValues['displayName'] : ''}" th:attr="aria-invalid=${formKey == 'STAFF_CREATE' and fieldErrors != null and fieldErrors.containsKey('displayName')},aria-describedby=${formKey == 'STAFF_CREATE' and fieldErrors != null and fieldErrors.containsKey('displayName') ? 'STAFF_CREATE-displayName-error' : null}"><span th:replace="~{fragments/form-feedback :: fieldError('STAFF_CREATE', 'displayName')}"></span></p>
            <p><label for="staff-role">角色</label><br><select id="staff-role" name="role" required th:attr="aria-invalid=${formKey == 'STAFF_CREATE' and fieldErrors != null and fieldErrors.containsKey('role')},aria-describedby=${formKey == 'STAFF_CREATE' and fieldErrors != null and fieldErrors.containsKey('role') ? 'STAFF_CREATE-role-error' : null}">
                <option value="LIBRARIAN" th:selected="${formKey == 'STAFF_CREATE' and formValues != null and formValues['role'] == 'LIBRARIAN'}">馆员</option>
                <option value="ADMIN" th:selected="${formKey == 'STAFF_CREATE' and formValues != null and formValues['role'] == 'ADMIN'}">管理员</option>
            </select><span th:replace="~{fragments/form-feedback :: fieldError('STAFF_CREATE', 'role')}"></span></p>
            <button type="submit">创建工作人员</button>
        </form>
    </section>
    <section class="info-card">
        <h2 class="card-title">现有工作人员</h2>
        <p th:if="${#lists.isEmpty(staff)}">暂无工作人员账号。</p>
        <div th:each="account : ${staff}" class="reader-row">
            <p><strong th:text="${account.displayName}"></strong>（<span th:text="${account.loginName}"></span>） · <span th:text="${account.role}"></span> · <span th:text="${account.status}"></span></p>
            <form method="post" th:action="@{/admin/accounts/{id}/reset-password(id=${account.id})}">
                <label th:for="${'staff-reset-' + account.id}">新临时密码</label><br>
                <input th:id="${'staff-reset-' + account.id}" name="newPassword" type="password" required minlength="12" maxlength="64" autocomplete="new-password" th:attr="aria-invalid=${formKey == 'STAFF_RESET_' + account.id and fieldErrors != null and fieldErrors.containsKey('newPassword')},aria-describedby=${formKey == 'STAFF_RESET_' + account.id and fieldErrors != null and fieldErrors.containsKey('newPassword') ? 'STAFF_RESET_' + account.id + '-newPassword-error' : null}">
                <span th:replace="~{fragments/form-feedback :: fieldError(${ 'STAFF_RESET_' + account.id }, 'newPassword')}"></span>
                <button type="submit">重置密码</button>
            </form>
            <form method="post" th:if="${account.status.name() == 'ACTIVE'}" th:action="@{/admin/accounts/{id}/disable(id=${account.id})}">
                <button type="submit">禁用账号</button>
            </form>
        </div>
        <p><a th:href="@{/admin}">返回管理员工作区</a></p>
    </section>
</main></body></html>
