<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读者工作区 · 图书管理系统</title>
    <link rel="stylesheet" href="/css/library.css" th:href="@{/css/library.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: navigation}"></header>
<main id="main-content" tabindex="-1" class="page-shell">
    <section class="hero">
        <p class="eyebrow">读者工作区</p>
        <h1 class="hero-title">我的图书</h1>
        <p class="hero-description">当前账号：<span th:text="${loginName}"></span>。可查看本人当前借阅和历史记录。</p>
    </section>
    <div th:replace="~{workspace/dashboard-fragments :: readerStatistics(${readerStats})}"></div>
    <section th:replace="~{fragments/reader-reminders :: reminders}"></section>
</main>
</body>
</html>
